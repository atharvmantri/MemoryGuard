name: Deploy landing site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Immutable pin for actions/checkout v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure GitHub Pages
        # Immutable pin for actions/configure-pages v5.
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Set up pnpm
        # Immutable pin for pnpm/action-setup v4.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.12.0

      - name: Set up Node.js
        # Immutable pin for actions/setup-node v4.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing site
        run: pnpm --filter @memoryguard/landing build
        env:
          MEMORYGUARD_GITHUB_PAGES: "true"

      - name: Upload Pages artifact
        # Immutable pin for actions/upload-pages-artifact v4.
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: apps/landing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Immutable pin for actions/deploy-pages v4.
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
